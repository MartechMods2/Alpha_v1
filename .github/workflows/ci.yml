name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/community-game-engine-v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh Bun lockfile on branch
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile"
            git push origin HEAD:codex/community-game-engine-v4
          fi
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: JavaScript syntax
        run: find commands core db functions notify queue routes utils -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: bun run test
      - name: Dashboard production build
        run: bun run --cwd dashboard build
