name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: JavaScript syntax
        run: find commands core db functions notify queue routes utils -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: bun run test
      - name: Dashboard production build
        run: bun run --cwd dashboard build
